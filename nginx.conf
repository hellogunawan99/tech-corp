# AXION — nginx config
# - Listens on 8080 (non-root safe)
# - Gzip for text
# - Long cache for static assets (immutable)
# - No-cache for HTML (always revalidate)
# - Sensible security headers

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection       "1; mode=block"           always;
    # Note: CSP is set via <meta> in index.html so it works on file:// too.

    # ---------- Compression (gzip) ----------
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------- Caching ----------
    # HTML — always revalidate (so deploys propagate fast)
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hashed / fingerprinted assets — long cache, immutable
    # (We don't hash filenames, so we lean on the extension + filename stability.)
    location ~* \.(webp|woff2|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    # CSS / JS — 1 day, revalidate in background
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        expires 1d;
        try_files $uri =404;
    }

    # Everything else
    location / {
        try_files $uri $uri/ =404;
    }

    # Hide dotfiles
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Hide nginx version
    server_tokens off;
}
